name: My First Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Run a passing test
        run: echo "tests passed!"

      - name: Run a failing test
        run: exit 1

      - name: This will be skipped
        run: echo "you will never see me"

  deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Deploy
        run: echo "deploying to Databricks!"
