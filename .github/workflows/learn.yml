name: My First Workflow

on:
  push:
    branches: [ "main" ]

jobs:
  say-hello:
    runs-on: ubuntu-latest

    steps:
      - name: Print a message
        run: echo "Hello World!"

      - name: Run Python
        run: python3 -c "print('Hello from Python!')"

      - name: Create a file
        run: echo "this is my file" > test.txt

      - name: Read that file
        run: cat test.txt
