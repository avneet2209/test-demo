name: Deploy to Databricks

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Deploy notebook to Databricks
        run: |
          CONTENT=$(base64 -w 0 notebooks/my_first_notebook.py)

          curl --fail \
            -X POST \
            "${{ secrets.DATABRICKS_HOST }}/api/2.0/workspace/import" \
            -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"path\": \"/Users/avneet09sidhu@gmail.com/my_first_notebook\",
              \"format\": \"SOURCE\",
              \"language\": \"PYTHON\",
              \"content\": \"$CONTENT\",
              \"overwrite\": true
            }"

      - name: Verify notebook deployed
        run: |
          curl --fail \
            -X GET \
            "${{ secrets.DATABRICKS_HOST }}/api/2.0/workspace/get-status?path=/Users/avneet09sidhu@gmail.com/my_first_notebook" \
            -H "Authorization: Bearer ${{ secrets.DATABRICKS_TOKEN }}"
